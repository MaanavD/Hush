[workspace]
resolver = "2"
members = [
    "crates/hush-app",
    "crates/hush-bench",
    "crates/hush-cli",
    "crates/hush-core",
]

[workspace.package]
authors = ["Maanav Dalal"]
edition = "2021"
license = "MIT"
repository = "https://github.com/MaanavD/Hush"
rust-version = "1.70"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
eframe = "0.33"
egui = "0.33"
foundry-local-sdk = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
