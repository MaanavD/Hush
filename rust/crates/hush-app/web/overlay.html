<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <title>Hush Overlay</title>
  </head>
  <body class="overlay-body">
    <main id="overlay" class="overlay-shell raw" data-state="ready">
      <div class="overlay-top">
        <div class="status-dot" aria-hidden="true"></div>
        <div class="status-copy">
          <div id="title" class="overlay-title">Ready</div>
          <div id="detail" class="overlay-detail">Focus a text field, then hold a hotkey.</div>
        </div>
        <div id="mode" class="mode-chip">RAW</div>
      </div>
      <canvas id="wave" width="520" height="84" aria-hidden="true"></canvas>
      <div id="hint" class="overlay-hint">Ctrl+H raw · Ctrl+Alt+H clean</div>
    </main>
    <script src="overlay.js"></script>
  </body>
</html>
