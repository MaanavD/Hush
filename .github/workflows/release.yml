name: Release

# Triggered by a version tag push, e.g. `git tag v1.0.0 && git push --tags`
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create a GitHub Release

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build + package one artifact per platform
  # ──────────────────────────────────────────────────────────────────────────
  package:
    name: Package (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            artifact: hush-win-x64.zip

          - rid: osx-arm64
            runner: macos-latest
            artifact: hush-osx-arm64.tar.gz

          - rid: linux-x64
            runner: ubuntu-latest
            artifact: hush-linux-x64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Both SDKs installed; dotnet picks the right one per TFM
      # (Hush.App targets net8.0-windows on Windows, net9.0 elsewhere)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x

      # ── Publish ──────────────────────────────────────────────────────────
      - name: Publish self-contained
        run: >
          dotnet publish src/Hush.App/Hush.App.csproj
          -r ${{ matrix.rid }}
          -c Release
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ github.ref_name }}
          -o ./dist/${{ matrix.rid }}

      # ── Windows: ZIP ──────────────────────────────────────────────────────
      - name: Package — Windows (zip)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path ./dist/win-x64/* -DestinationPath hush-win-x64.zip

      # ── macOS: .app bundle → tar.gz ───────────────────────────────────────
      - name: Package — macOS (.app bundle)
        if: matrix.rid == 'osx-arm64'
        run: |
          APP=Hush.app
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          # Copy publish output into the bundle
          cp -r ./dist/osx-arm64/* "$APP/Contents/MacOS/"

          # Place the pre-authored Info.plist and stamp the version
          sed "s/1\.0\.0/${{ github.ref_name }}/g" \
            src/Hush.App/Assets/Info.plist \
            > "$APP/Contents/Info.plist"

          # Make the entry-point executable
          chmod +x "$APP/Contents/MacOS/Hush.App"

          tar czf hush-osx-arm64.tar.gz "$APP"

      # ── Linux: tar.gz ─────────────────────────────────────────────────────
      - name: Package — Linux (tar.gz)
        if: matrix.rid == 'linux-x64'
        run: |
          chmod +x ./dist/linux-x64/Hush.App
          tar czf hush-linux-x64.tar.gz -C ./dist linux-x64

      # ── Upload artifact for this platform ─────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Collect all platform artifacts and publish a GitHub Release
  # ──────────────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hush ${{ github.ref_name }}
          draft: false
          prerelease: >-
            ${{
              contains(github.ref_name, 'alpha') ||
              contains(github.ref_name, 'beta')  ||
              contains(github.ref_name, 'rc')
            }}
          generate_release_notes: true
          files: |
            ./artifacts/*.zip
            ./artifacts/*.tar.gz
