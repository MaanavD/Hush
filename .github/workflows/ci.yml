name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            publishProfile: win-x64
            executable: Hush.App.exe
          - name: macOS arm64
            os: macos-14
            rid: osx-arm64
            publishProfile: osx-arm64
            executable: Hush.App
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            publishProfile: linux-x64
            executable: Hush.App

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore dotnet/Hush.sln --ignore-failed-sources

      - name: Build
        run: dotnet build dotnet/Hush.sln --no-restore -c Release

      - name: Run tests and E2E smoke tests
        run: >
          dotnet test dotnet/Hush.sln
          --no-build
          -c Release
          --logger "trx;LogFileName=${{ matrix.rid }}.trx"
          --logger "console;verbosity=normal"

      - name: Publish smoke
        run: >
          dotnet publish dotnet/src/Hush.App/Hush.App.csproj
          -c Release
          -p:PublishProfile=${{ matrix.publishProfile }}
          -p:Version=0.0.0-ci
          -p:AssemblyVersion=0.0.0.0
          -p:FileVersion=0.0.0.0
          -p:InformationalVersion=0.0.0-ci

      - name: Validate publish output
        shell: pwsh
        run: |
          $publishDir = Join-Path "dotnet/src/Hush.App/bin/publish" "${{ matrix.rid }}"
          if (-not (Test-Path $publishDir)) {
            throw "Publish directory '$publishDir' was not created."
          }

          $exePath = Join-Path $publishDir "${{ matrix.executable }}"
          if (-not (Test-Path $exePath)) {
            throw "Expected executable '$exePath' was not created."
          }

          $runtimeFiles = Get-ChildItem -Path $publishDir -File
          if ($runtimeFiles.Count -eq 0) {
            throw "Publish directory '$publishDir' is empty."
          }

          if ("${{ matrix.rid }}" -eq "win-x64" -and ($runtimeFiles.Count -ne 1 -or $runtimeFiles[0].Name -ne "Hush.App.exe")) {
            throw "Windows publish output must contain only Hush.App.exe, got: $($runtimeFiles.Name -join ', ')"
          }

      - name: Setup Rust
        run: rustup default stable

      - name: Install Linux Rust/Tauri dependencies
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            libxtst-dev \
            libasound2-dev \
            libssl-dev

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Rust build smoke
        run: cargo build --manifest-path rust/Cargo.toml -p hush-app -p hush-bench --release

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-results-${{ matrix.rid }}
          path: "**/TestResults/*.trx"
          retention-days: 30
