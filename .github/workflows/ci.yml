name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs for the same branch/PR so new pushes don't queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    # NOTE: Pre-release NuGet packages not yet on nuget.org are vendored in the
    # packages/ directory and picked up automatically via NuGet.config.
    # When the SDK is published to nuget.org the packages/ dir can be removed.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore --ignore-failed-sources

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Run tests
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=TestResults.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 30
