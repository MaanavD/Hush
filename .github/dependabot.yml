version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      dotnet-runtime-and-test:
        patterns:
          - Microsoft.Extensions.*
          - Microsoft.NET.Test.Sdk
          - xunit*
          - coverlet.*
          - Moq
      avalonia:
        patterns:
          - Avalonia*
      foundry-local:
        patterns:
          - Microsoft.AI.Foundry.Local*
          - Microsoft.ML.OnnxRuntime*
    ignore:
      # Avalonia.ReactiveUI has no 12.x release yet; a major-version core bump produces a
      # mismatched, unbuildable package set. Re-enable manually once ReactiveUI 12 ships.
      - dependency-name: "Avalonia*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
