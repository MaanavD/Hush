<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="micGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#625fff"/>
      <stop offset="50%" stop-color="#8d54ff"/>
      <stop offset="100%" stop-color="#ac4bff"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#625fff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Microphone body (rounded rect) -->
  <rect x="204" y="112" width="104" height="192" rx="52" ry="52"
        fill="url(#micGrad)" filter="url(#shadow)"/>

  <!-- Mic arc -->
  <path d="M168 264 a88 88 0 0 0 176 0"
        fill="none" stroke="url(#micGrad)" stroke-width="20" stroke-linecap="butt"/>

  <!-- Mic stand (vertical line) -->
  <line x1="256" y1="352" x2="256" y2="400"
        stroke="url(#micGrad)" stroke-width="20" stroke-linecap="round"/>

  <!-- Mic base (horizontal line) -->
  <line x1="208" y1="400" x2="304" y2="400"
        stroke="url(#micGrad)" stroke-width="20" stroke-linecap="round"/>
</svg>
